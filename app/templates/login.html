{% extends "base.html" %}
{% block title %}Login | DoneDesk{% endblock %}

{% block content %}
<div class="auth-layout auth-layout-centered">
  <section class="auth-panel card-surface auth-panel-glow auth-panel-centered">
    <div class="mb-4">
      <p class="eyebrow">Welcome back</p>
      <h1 class="display-title">Sign in to DoneDesk.</h1>
      <p class="lead text-soft">Your AI-first workspace for tasks, analytics and live team visibility.</p>
    </div>

    <div id="auth-alert" class="alert d-none" role="alert"></div>

    <form id="auth-form" data-auth-form="login" method="post" action="{{ url_for('auth.login_page') }}" class="auth-form">
      <div class="mb-3">
        <label class="form-label" for="identifier">Email or Username</label>
        <input class="form-control form-control-lg" id="identifier" name="identifier" type="text" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control form-control-lg" id="password" name="password" type="password" placeholder="••••••••" required>
      </div>
      <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
        <div class="form-check">
          <input class="form-check-input" id="remember" name="remember" type="checkbox">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a class="link-soft" href="{{ url_for('auth.register_page') }}">Create account</a>
      </div>
      <button class="btn btn-accent btn-lg w-100" type="submit">
        <span class="btn-label">Login</span>
        <span class="btn-spinner spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
      </button>
    </form>
  </section>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
